<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Antrian Cetak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .custom-scroll::-webkit-scrollbar { width: 4px; }
      .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-6 md:p-10 font-sans antialiased">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row items-center justify-between gap-4 max-w-7xl mx-auto w-full pb-6 border-b border-slate-800/80">
      <div class="flex items-center gap-3">
        <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <h1 class="text-lg md:text-xl font-semibold tracking-wide text-slate-200 uppercase">
          Status Antrian Cetak
        </h1>
      </div>
      <div class="text-xs font-mono text-slate-400 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full flex items-center gap-2">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span> Live Monitor
      </div>
    </header>

    <!-- Content Grid -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 my-auto max-w-7xl mx-auto w-full py-8">
      
      <!-- Card: Sedang Diproses -->
      <section class="lg:col-span-7 bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 p-8 md:p-12 rounded-3xl shadow-2xl flex flex-col justify-between relative overflow-hidden">
        <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-500/5 rounded-full blur-3xl pointer-events-none"></div>
        
        <div>
          <div class="flex items-center justify-between mb-6">
            <span class="text-xs font-semibold uppercase tracking-widest text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 rounded-full">
              Sedang Diproses
            </span>
            <span class="text-xs text-slate-500 font-mono">PRIORITY #1</span>
          </div>

          <div id="current-processing" class="text-7xl md:text-9xl font-black text-white tracking-tight my-6 font-mono">
            ---
          </div>
        </div>

        <div class="pt-6 border-t border-slate-800/60">
          <p class="text-xs font-medium uppercase tracking-wider text-slate-500 mb-1">Pemilik Pesanan</p>
          <p id="current-name" class="text-xl md:text-2xl font-medium text-slate-200 truncate">
            Menunggu Antrian...
          </p>
        </div>
      </section>

      <!-- Card: Antrian Berikutnya -->
      <section class="lg:col-span-5 bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 p-6 md:p-8 rounded-3xl shadow-2xl flex flex-col">
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-800/60">
          <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-400">
            Antrian Berikutnya
          </h2>
          <span class="text-xs text-slate-500 font-mono">NEXT UP</span>
        </div>

        <div id="next-queue-list" class="space-y-2.5 overflow-y-auto max-h-[360px] pr-1 custom-scroll flex-grow">
          <!-- Diisi via JS -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-600 font-mono pt-4 border-t border-slate-800/40">
      Created by @egianshari
    </footer>

    <script>
      function loadDisplay() {
        fetch("/api/queue")
          .then((res) => res.json())
          .then((data) => {
            const procEl = document.getElementById("current-processing");
            const nameEl = document.getElementById("current-name");
            const nextListEl = document.getElementById("next-queue-list");

            if (data.length > 0) {
              procEl.innerText = data[0].no_order;
              nameEl.innerText = data[0].nama + (data[0].ukuran ? " (" + data[0].ukuran + ")" : "");

              nextListEl.innerHTML = "";
              if (data.length > 1) {
                for (let i = 1; i < data.length; i++) {
                  nextListEl.innerHTML += `
                    <div class="bg-slate-900/80 border border-slate-800/80 p-4 rounded-2xl flex justify-between items-center transition hover:border-slate-700">
                      <span class="font-mono font-bold text-lg text-indigo-400">#${data[i].no_order}</span>
                      <span class="text-slate-300 text-sm font-medium truncate max-w-[200px]">${data[i].nama}</span>
                    </div>
                  `;
                }
              } else {
                nextListEl.innerHTML = `
                  <div class="h-full flex items-center justify-center py-12">
                    <p class="text-slate-600 text-xs italic">Tidak ada antrian berikutnya.</p>
                  </div>`;
              }
            } else {
              procEl.innerText = "KOSONG";
              nameEl.innerText = "Belum ada antrian masuk";
              nextListEl.innerHTML = `
                <div class="h-full flex items-center justify-center py-12">
                  <p class="text-slate-600 text-xs italic">Antrian bersih.</p>
                </div>`;
            }
          });
      }

      setInterval(loadDisplay, 3000);
      loadDisplay();
    </script>
  </body>
</html>
