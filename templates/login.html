<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - Print Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div
      class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-100 text-center"
    >
      <div
        class="bg-slate-800 text-white w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 text-xl"
      >
        🔒
      </div>
      <h2 class="text-2xl font-black text-slate-800">Admin Akses</h2>
      <p class="text-slate-500 text-sm mt-1 mb-6">
        Silakan login untuk kelola antrian
      </p>

      {% if error %}
      <div
        class="bg-red-50 text-red-600 text-sm p-3 rounded-xl mb-4 font-bold border border-red-200"
      >
        {{ error }}
      </div>
      {% endif %}

      <form action="/login" method="POST" class="space-y-4">
        <div>
          <input
            type="text"
            name="username"
            required
            placeholder="Username"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-sm"
          />
        </div>
        <div>
          <input
            type="password"
            name="password"
            required
            placeholder="Password"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-sm"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-slate-800 text-white font-bold py-3 px-4 rounded-xl hover:bg-slate-900 shadow-lg shadow-slate-200 transition duration-300 text-sm"
        >
          Masuk Dashboard
        </button>
      </form>
      <a
        href="/"
        class="block mt-4 text-xs font-bold text-blue-600 hover:underline"
        >← Kembali ke Form Pelanggan</a
      >
    </div>
  </body>
</html>
